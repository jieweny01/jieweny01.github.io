<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.paper-figure-switcher').forEach(function (switcher) {
    var tabs = switcher.querySelectorAll('.paper-figure-tab');
    var img = switcher.querySelector('.paper-figure-img');

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (t) {
          t.classList.remove('is-active');
          t.setAttribute('aria-selected', 'false');
        });
        tab.classList.add('is-active');
        tab.setAttribute('aria-selected', 'true');
        img.src = tab.getAttribute('data-fig-src');
        img.alt = tab.getAttribute('data-fig-alt');
      });
    });
  });
});
</script>
